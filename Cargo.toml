[package]
name = "tfex"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
description = "Read-only, multi-repository Terraform code and state explorer for coding agents"
license = "MIT"
repository = "https://github.com/vaaaaanquish/tfex"
readme = "README.md"
keywords = ["terraform", "cli", "index", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
camino = { version = "1.2.6", features = ["serde1"] }
clap = { version = "4.6.9", features = ["derive", "env"] }
hcl-edit = "0.10.0"
ignore = "0.4.34"
jiff = { version = "1.0.1", default-features = false, features = ["std"] }
rayon = "1.12.0"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled", "fallible_uint"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"

[lints.rust]
unsafe_code = "forbid"
unreachable_pub = "warn"
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Hand-picked from the `restriction` group.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unwrap_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
